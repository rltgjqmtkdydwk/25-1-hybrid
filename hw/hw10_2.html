<!DOCTYPE html>
<html>
<head>
<meta http-equiv="content-type" content="text/html;charset=utf-8" />
<title>hw10_2 : Jquery Event</title>
<script src="http://code.jquery.com/jquery-1.11.1.min.js"></script>

<script type="text/javascript">
//<![CDATA[
    $(document).ready(function () {
       // 이부분에  jquery, javascript 작성
        // + 버튼을 누르면 font-size가 1 증가
        $('#increase').click(function() {
            let size = parseInt($('p').css('font-size'));
            $('p').css('font-size', (size + 1) + 'px');
        });
        // - 버튼을 누르면 font-size가 1 감소
        $('#decrease').click(function() {
            let size = parseInt($('p').css('font-size'));
            $('p').css('font-size', (size - 1) + 'px');
        });
        // 0 버튼을 누르면 기본값 16로
        $('#default').click(function() {
            $('p').css('font-size', 16 + 'px');
        });
        // select 색상을 변경하면 색상을 변경
        $('select').change(function() {
            const selectedColor = $(this).val();
            $('p').css('color', selectedColor);
        });
    });
//]]>
</script>
<style type="text/css">

</style>
</head>
<body>
 <div id="f_wrap">
    <dl>
      <dt>글자크기</dt>
      <dd class="zoom">
        <button id="increase">+</button>
        <button id="default">0</button>
        <button id="decrease">-</button>
      </dd>
      <dt>글자모양</dt>
      <dd class="f_style">
          <select name="fs" id="fs">
            <option value="black">검정</option>
            <option value="blue">파랑</option>
            <option value="red">빨강</option>
            <option value="yellow">노랑</option>
           </select>
      </dd>
    </dl>
 </div>
 <p id="txt_wrap">
  송충이는 솔잎을 먹어야 산다.
   </p>
</body>
</html>
